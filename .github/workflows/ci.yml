name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — JUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamify-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: gamify-backend/pom.xml

      - name: Run tests (mvnw test)
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend-tests:
    name: Frontend — Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamify-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gamify-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc -b

      - name: Lint (oxlint)
        run: npm run lint

      - name: Run tests (vitest)
        run: npm test
