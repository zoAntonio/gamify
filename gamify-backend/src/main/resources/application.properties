# ==============================
# GAMIFY - Configuration Backend
# ==============================

# Serveur
server.port=8081

# Base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gamify_db
spring.datasource.username=gamify_user
spring.datasource.password=gamify_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Le schéma est géré par Flyway (voir src/main/resources/db/migration) :
# Hibernate se contente de vérifier que les entités correspondent aux tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true

# JWT
gamify.jwt.secret=gamify_super_secret_key_change_in_production_2024
gamify.jwt.expiration=86400000

# CORS (origine du frontend Vite en dev)
gamify.cors.allowed-origin=http://localhost:5173

# Backoffice : un seul admin, automatique, jamais promu via l'app (décision projet).
# Compte de test seedé en V14 (username "admin", mot de passe "admin") pour
# faciliter la vérification manuelle en local — à changer avant tout déploiement partagé.
gamify.admin.email=admin@admin.com

# Upload d'avatar (photo de profil, servie sur /uploads/**)
gamify.uploads.dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Logs
logging.level.com.gamify=DEBUG

# Documentation API (Swagger UI accessible sur /swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
